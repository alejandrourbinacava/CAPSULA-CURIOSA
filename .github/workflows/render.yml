name: Renderizar vídeo (Cápsula Curiosa)

on:
  workflow_dispatch:
    inputs:
      nuevoVideo:
        description: "Generar un VÍDEO NUEVO (coge el siguiente tema de topics.json y Claude escribe el guion). Desmarca solo para re-renderizar el episodio activo."
        type: boolean
        default: true
  schedule:
    - cron: "0 6 * * *"   # cada día a las 06:00 UTC (nuevo vídeo automático)

permissions:
  contents: write   # para guardar el avance del tema (topics.json + episodes/) tras cada run

jobs:
  render:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Python 3.11 (para Whisper)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias del sistema (ffmpeg + libs del Chrome de Remotion)
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # ffmpeg estático desde GitHub (rápido y fiable, SIN depender de los mirrors de apt que se cuelgan)
          curl -fsSL -o /tmp/ffmpeg.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          mkdir -p /tmp/ff && tar xf /tmp/ffmpeg.tar.xz -C /tmp/ff --strip-components=1
          sudo cp /tmp/ff/bin/ffmpeg /tmp/ff/bin/ffprobe /usr/local/bin/
          echo "== ffmpeg ==" && ffmpeg -version | head -1
          # libs de Chrome para Remotion (best-effort; el runner suele traerlas ya). apt con timeout para que no se cuelgue.
          APT_OPTS="-o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o DPkg::Lock::Timeout=90"
          sudo rm -f /etc/apt/sources.list.d/*msft* /etc/apt/sources.list.d/microsoft* 2>/dev/null || true
          sudo timeout 120 apt-get update $APT_OPTS || echo "apt update omitido"
          sudo timeout 200 apt-get install -y --no-install-recommends $APT_OPTS \
            libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2 \
            libxrandr2 libxkbcommon0 libxfixes3 libxcomposite1 libxdamage1 \
            libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2 || echo "libs via apt omitido (probablemente ya presentes)"

      - name: Instalar faster-whisper (sincronía palabra a palabra)
        run: pip install --disable-pip-version-check faster-whisper

      - name: Instalar dependencias npm
        run: npm install

      - name: 00) Claude escribe el guion del siguiente tema (solo vídeo nuevo)
        if: ${{ github.event_name == 'schedule' || inputs.nuevoVideo }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/00-write-script.mjs

      - name: Fijar episodio activo
        id: ep
        run: echo "dir=$(cat episodes/active.txt)" >> $GITHUB_OUTPUT

      - name: "01a) Descargar assets (fotos Wikipedia + iconos OpenAI/Iconify normalizados)"
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/01-assets.mjs "${{ steps.ep.outputs.dir }}"

      - name: 01b) Descargar media (clips Pexels/Pixabay + gifs Giphy)
        continue-on-error: true
        env:
          PEXELS_KEY: ${{ secrets.PEXELS_KEY }}
          PIXABAY_KEY: ${{ secrets.PIXABAY_KEY }}
          GIPHY_KEY: ${{ secrets.GIPHY_KEY }}
        run: node scripts/00-fetch-media.mjs "${{ steps.ep.outputs.dir }}"

      - name: 01c) Comprobar assets + GATE de normalización (falla si vector sin normalizar)
        run: node scripts/assets-check.mjs "${{ steps.ep.outputs.dir }}"

      - name: 01d) Voz (genaipro) + sincronía por palabra (Whisper)
        env:
          GENAIPRO_API_KEY: ${{ secrets.GENAIPRO_API_KEY }}
        run: node scripts/01-tts.mjs "${{ steps.ep.outputs.dir }}"

      - name: "01e) Enrich (Claude: qué dibujar por frase, fotos+doodles sincronizados a la voz)"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/01e-enrich.mjs "${{ steps.ep.outputs.dir }}"

      - name: "01f) Etiquetas en español (Claude)"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/01f-labels.mjs "${{ steps.ep.outputs.dir }}"

      - name: "01g) Generar dibujos auto (fotos Wikipedia gratis + doodles OpenAI, reutiliza librería)"
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/01-assets.mjs "${{ steps.ep.outputs.dir }}"

      - name: 02) Compilar scenes.json (lienzo acumulativo + dinamismo)
        run: node scripts/02-build-scenes.mjs "${{ steps.ep.outputs.dir }}"

      - name: 02b) Lint de variedad (informe)
        continue-on-error: true
        run: node scripts/lint-variety.mjs "${{ steps.ep.outputs.dir }}"

      - name: 02c) GUARDAR la voz (de pago) ANTES de renderizar (si falla el render, no se pierde)
        run: |
          git config user.name "capsula-bot"
          git config user.email "bot@capsulacuriosa"
          git add topics.json episodes public/active/scenes.json || true
          git commit -m "Auto: guion + voz de '${{ steps.ep.outputs.dir }}' (guardado antes de render)" || echo "sin cambios"
          git pull --no-rebase --no-edit origin main || true
          git push || echo "push diferido"

      - name: 02d) VERIFICAR (GATE — un vídeo con texto solapado NO se puede renderizar)
        run: node scripts/verify.mjs "${{ steps.ep.outputs.dir }}"

      - name: 03) Renderizar el vídeo (Remotion · Scene)
        run: npx remotion render src/index.ts Scene out/VIDEO_RAW.mp4 --concurrency=2

      - name: 03b) Audio final (POP en cada entrada de dibujo + música de fondo)
        run: node scripts/03b-audio.mjs "${{ steps.ep.outputs.dir }}"

      - name: 04) Miniatura (fotograma representativo del vídeo)
        continue-on-error: true
        run: npx remotion still src/index.ts Scene out/thumbnail.png --frame=90

      - name: Leer título y créditos de assets (CC BY, etc.)
        id: meta
        run: |
          echo "title=$(node -p "require('./public/active/scenes.json').meta.title || 'Episodio'")" >> $GITHUB_OUTPUT
          echo "fecha=$(date +%Y-%m-%d)" >> $GITHUB_OUTPUT
          node -e "const a=require('./'+require('fs').readFileSync('episodes/active.txt','utf8').trim()+'/assets.json');const s=new Set();for(const k in a){const at=a[k].attribution;if(at&&at.license&&at.license!=='?')s.add(at.source.split(':')[0]+' ('+at.license+')');}console.log('Iconos: '+([...s].join(', ')||'—')+' · Fotos: Wikimedia Commons')" > out/credits.txt
          echo "credits=$(cat out/credits.txt)" >> $GITHUB_OUTPUT

      - name: 05) Subir como artifact (copia temporal, 90 días)
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_number }}
          path: |
            out/VIDEO_FINAL.mp4
            out/thumbnail.png
          retention-days: 90

      - name: 05b) Publicar como Release PERMANENTE (no se borra nunca)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: video-${{ github.run_number }}
          name: "🎬 ${{ steps.meta.outputs.title }} (${{ steps.meta.outputs.fecha }})"
          body: "Vídeo generado automáticamente (pipeline spec: guion fijo + sincronía por palabra). Descarga el MP4 abajo 👇\n\nCréditos: ${{ steps.meta.outputs.credits }}"
          files: |
            out/VIDEO_FINAL.mp4
            out/thumbnail.png

      - name: 06) Guardar el episodio y el avance del tema
        run: |
          git config user.name "capsula-bot"
          git config user.email "bot@capsulacuriosa"
          git add topics.json episodes public/assets public/active || true
          git commit -m "Auto: episodio '${{ steps.meta.outputs.title }}' + avance de tema" || echo "sin cambios"
          git pull --no-rebase --no-edit origin main || true
          git push
