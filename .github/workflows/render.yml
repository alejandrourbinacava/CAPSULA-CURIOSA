name: Renderizar vídeo (Cápsula Curiosa)

on:
  workflow_dispatch:
    inputs:
      nuevoVideo:
        description: "Generar un VÍDEO NUEVO (coge el siguiente tema de topics.json y escribe el guion con IA). Desmarca solo para re-renderizar el actual."
        type: boolean
        default: true
  schedule:
    - cron: "0 6 * * *"   # cada día a las 06:00 UTC (nuevo vídeo automático)

permissions:
  contents: write   # para guardar el avance del tema (topics.json) tras cada run

jobs:
  render:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Dependencias del sistema (ffmpeg + libs del Chrome de Remotion)
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -o DPkg::Lock::Timeout=180
          sudo apt-get install -y --no-install-recommends -o DPkg::Lock::Timeout=180 ffmpeg \
            libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2 \
            libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 \
            libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2

      - name: Instalar dependencias npm
        run: npm install

      - name: 1) Escribir el guion del siguiente tema (IA)
        if: ${{ github.event_name == 'schedule' || inputs.nuevoVideo }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node next-video.mjs

      - name: 2) Generar voz + fotos + vídeos + sincronía + música
        if: ${{ github.event_name == 'schedule' || inputs.nuevoVideo }}
        env:
          GENAIPRO_API_KEY: ${{ secrets.GENAIPRO_API_KEY }}
          PIXABAY_KEY: ${{ secrets.PIXABAY_KEY }}
          PEXELS_KEY: ${{ secrets.PEXELS_KEY }}
          GIPHY_KEY: ${{ secrets.GIPHY_KEY }}
        run: node generate.mjs

      - name: 3) Renderizar el vídeo (Remotion · AutoVideo)
        run: npx remotion render src/index.ts AutoVideo out/video.mp4 --concurrency=2

      - name: 4) Mezclar audio (voz + música -25dB + pops)
        run: |
          ffmpeg -y -i out/video.mp4 \
            -stream_loop -1 -i public/voz/bg_music.wav \
            -i public/voz/sfx_full.wav \
            -filter_complex "[1:a]volume=-25dB[m];[2:a]volume=-10dB[s];[0:a][m][s]amix=inputs=3:normalize=0[a]" \
            -map 0:v -map "[a]" -c:v copy -c:a aac -b:a 192k -shortest \
            out/VIDEO_FINAL.mp4

      - name: 5) Renderizar miniatura (rejilla desde el config)
        run: npx remotion still src/index.ts AutoThumb out/thumbnail.png --frame=0

      - name: Leer título del vídeo
        id: meta
        run: |
          echo "title=$(node -p "require('./video.config.json').title")" >> $GITHUB_OUTPUT
          echo "fecha=$(date +%Y-%m-%d)" >> $GITHUB_OUTPUT

      - name: 6) Subir como artifact (copia temporal, 90 días)
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_number }}
          path: |
            out/VIDEO_FINAL.mp4
            out/thumbnail.png
          retention-days: 90

      - name: 6b) Publicar como Release PERMANENTE (no se borra nunca)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: video-${{ github.run_number }}
          name: "🎬 ${{ steps.meta.outputs.title }} (${{ steps.meta.outputs.fecha }})"
          body: "Vídeo generado automáticamente. Descarga el MP4 abajo 👇"
          files: |
            out/VIDEO_FINAL.mp4
            out/thumbnail.png

      - name: 7) Guardar el avance del tema para el próximo día
        if: ${{ github.event_name == 'schedule' || inputs.nuevoVideo }}
        run: |
          git config user.name "capsula-bot"
          git config user.email "bot@capsulacuriosa"
          git add topics.json video.config.json
          git commit -m "Auto: guion del siguiente tema" || echo "sin cambios"
          git pull --no-rebase --no-edit origin main || true
          git push
